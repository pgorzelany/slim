[package]
name = "slim"
version = "1.0.0"
edition = "2024"
description = "Bootstrap-independent verification and benchmark tools for SLIM"
license = "Apache-2.0 OR MIT"
publish = false

[[bin]]
name = "slim-govern"
path = "src/bin/slim-govern.rs"

[[bin]]
name = "slim-bench"
path = "src/bin/slim-bench.rs"

[[bin]]
name = "slim-conform"
path = "src/bin/slim-conform.rs"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"
